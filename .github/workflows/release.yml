name: release

# Tag-driven only. `npm version patch && git push --follow-tags` is the whole release ritual.
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Covers the floor declared in package.json engines (>=20), not just what CI happens to ship.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run test:ci

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC). This is what replaces NPM_TOKEN
      contents: write # gh release create
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Belt and braces: the bundled npm moves around between runner images.
      - run: npm install -g npm@latest

      - run: npm ci

      # A tag that disagrees with package.json would publish the wrong version under the
      # right-looking release. Fail loudly instead.
      - name: Verify tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      # No NODE_AUTH_TOKEN. OIDC handles auth, and provenance attestation is automatic.
      - run: npm publish

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
